[project]
name = "tg-scheduler"
version = "0.1.0"
description = "Precision Telegram userbot message scheduler"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10.0",
    "cryptg>=0.4.0",
    "python-dotenv>=1.0.1",
    "telethon>=1.46.0",
]

[project.scripts]
tg-scheduler = "tg_scheduler.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "ASYNC"]
